name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          install: true
      - name: Build
        run: |
          docker buildx build --load --tag manylinux-rust:ci \
            --build-arg MATURIN_VERSION=1.8 .
      - name: Verify installed toolchain
        run: |
          docker run --rm --entrypoint /bin/sh manylinux-rust:ci -ec '
            cargo xwin --version
            for VER in 3.14 3.13 3.12 3.11 3.10; do
              python"$VER" -m maturin --version
            done
          '
